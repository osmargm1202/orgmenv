name: CI Version Wiring Guard

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  version-wiring:
    name: Validate version wiring
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run version wiring test
        run: npm test -- template/node-cli-ui/tests/version.test.ts
